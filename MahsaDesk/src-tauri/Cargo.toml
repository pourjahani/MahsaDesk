[package]
name = "mahsadesk"
version = "0.1.0"
description = "MahsaDesk - free v2ray/xray client for Windows"
authors = ["MahsaDesk"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sysproxy = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "socks"] }
urlencoding = "2"
rand = "0.8"


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
