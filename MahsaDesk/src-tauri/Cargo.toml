[package]
name = "mahsadesk"
version = "0.3.10"
description = "MahsaDesk - free v2ray/xray client for Windows"
authors = ["MahsaDesk"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sysproxy = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "socks", "json", "system-proxy"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
urlencoding = "2"
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
# Clash subscriptions are YAML; 0.9 is deprecated-but-frozen and does exactly
# what the #15 importer needs (parse to Value and walk).
serde_yaml = "0.9"


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
